kind: pipeline
name: deploy-shorty

type: docker

trigger:
  branch:
    - master
  event:
    - push
    - custom

steps:
  - name: upload
    image: appleboy/drone-scp
    settings:
      host: 192.168.0.114
      username: root
      key:
        from_secret: key
      port: 22
      target: /opt/shorty
      source:
        - Dockerfile
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - nuxt.config.ts
        - tsconfig.json
        - eslint.config.mjs
        - components.json
        - app
        - server
        - schemas
        - public
        - i18n
        - deploy.sh
        - .dockerignore

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 192.168.0.114
      username: root
      key:
        from_secret: key
      port: 22
      timeout: 30m
      script:
        - cd /opt/shorty
        - chmod +x deploy.sh
        - ./deploy.sh
    depends_on:
      - upload
